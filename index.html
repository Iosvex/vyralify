<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/vyralify-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090C" />
    <title>Vyralify | The Complete Creator-to-Cash Ecosystem</title>
    <meta name="description" content="Vyralify turns viral engagement into automated creator revenue with high-yield clipping challenges, viral scripting, brand campaigns, and creator growth systems." />

    <!-- Typography: General Sans (Display), Plus Jakarta Sans (Headings/Body), JetBrains Mono (Stats/Data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap" rel="stylesheet" />

    <!-- Permanent Dark Mode Enforcer -->
    <script>
      (function() {
        try {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          localStorage.setItem('vyralify-theme', 'dark');
          localStorage.setItem('vyralify-theme-v3', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#08090C] text-neutral-200 font-sans antialiased selection:bg-emerald-500/20 selection:text-emerald-400 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
