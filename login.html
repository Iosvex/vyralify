<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Vyralify Member Workspace</title>
  <meta name="description" content="Access your Vyralify creator workspace, AI tools, curriculum, and community.">
  
  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap" rel="stylesheet">
  <link rel="icon" href="/vyralifylogo.jpeg">
  <link rel="stylesheet" href="/styles.css">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 0%, var(--blue-soft) 0%, var(--bg-soft) 70%, #ffffff 100%);
      padding: 24px;
      position: relative;
    }

    .auth-header {
      margin-bottom: 32px;
      text-align: center;
    }

    .auth-header .logo {
      font-size: 1.5rem;
      margin-bottom: 16px;
      justify-content: center;
    }

    .auth-card-container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 36px 32px;
      position: relative;
    }

    .auth-card-title {
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }

    .auth-card-sub {
      font-size: .92rem;
      color: var(--ink-soft);
      text-align: center;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap i {
      position: absolute;
      left: 14px;
      font-size: 1.1rem;
      color: var(--ink-faint);
    }

    .input-wrap input {
      width: 100%;
      padding: 13px 14px 13px 44px;
      font-family: var(--font-body);
      font-size: .95rem;
      color: var(--ink);
      background: var(--bg-soft);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color .2s, background .2s, box-shadow .2s;
    }

    .input-wrap input:focus {
      border-color: var(--blue);
      background: #fff;
      box-shadow: 0 0 0 4px var(--blue-soft);
    }

    .form-error {
      display: none;
      font-size: .85rem;
      font-weight: 500;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .divider span {
      font-size: .78rem;
      font-family: var(--font-mono);
      color: var(--ink-faint);
      text-transform: uppercase;
    }

    .google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #ffffff;
      color: var(--ink);
      border: 1.5px solid var(--line);
      border-radius: 999px;
      padding: 13px;
      font-weight: 600;
      font-size: .92rem;
      transition: border-color .2s, transform .2s, box-shadow .2s;
    }
    .google-btn:hover {
      border-color: var(--ink);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .auth-footer {
      text-align: center;
      margin-top: 28px;
      font-size: .88rem;
      color: var(--ink-soft);
    }

    .auth-footer a {
      color: var(--blue);
      font-weight: 600;
      transition: color .2s;
    }
    .auth-footer a:hover {
      color: var(--blue-dark);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-header">
      <a href="/index.html" class="logo"><span class="logo-dot"></span>VYRALIFY</a>
    </div>

    <div class="auth-card-container">
      <h1 class="auth-card-title">Welcome Back</h1>
      <p class="auth-card-sub">Log in to access your Vyralify creator workspace</p>

      <div class="form-error"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <div class="input-wrap">
            <i class="ph-bold ph-envelope-simple"></i>
            <input id="login-email" type="email" name="email" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-wrap">
            <i class="ph-bold ph-lock-key"></i>
            <input id="login-password" type="password" name="password" placeholder="••••••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:14px; margin-top:8px;">
          Log In To Dashboard <i class="ph-bold ph-arrow-right shift-right"></i>
        </button>
      </form>

      <div class="divider"><span>OR</span></div>

      <button id="google-login" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
        Continue with Google
      </button>

      <div class="auth-footer">
        Don't have an active membership yet? <br>
        <a href="/index.html#pricing">Join Vyralify (₹499 / $19) →</a>
      </div>
    </div>
  </div>

  <script type="module" src="/assets/js/auth.js"></script>
</body>
</html>
